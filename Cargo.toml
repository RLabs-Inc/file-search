[package]
name = "file-search"
version = "0.1.0"
edition = "2024"
authors = ["Rodrigo Araujo <rodrigo@rlabs.art>"]
description = "Find anything, anywhere: searches inside every file, decoding archives, databases, plists, compressed streams and encoded text"
license = "MIT"
repository = "https://github.com/RLabs-Inc/file-search"
readme = "README.md"
keywords = ["search", "forensics", "grep", "sqlite", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
base64 = "0.23.1"
bzip2 = "0.6.1"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
ctrlc = "3.5.2"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
memmap2 = "0.9.12"
plist = "1.10.3"
regex = "1.13.1"
rlabs-prism = "0.1.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
walkdir = "2.5.0"
xattr = "1.7.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
